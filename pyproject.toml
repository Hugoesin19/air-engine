[project]
name = "air-engine"
version = "0.1.0"
description = "Deterministic runtime verification engine for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Hugoesin19" }]
dependencies = [
    "pyyaml>=6.0",
]
keywords = ["ai", "verification", "agents", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Hugoesin19/air-engine"

[project.scripts]
air-engine = "air_engine.interfaces.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_engine"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]
pilot = [
    "google-genai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
mypy_path = "src"
packages = ["air_engine"]
