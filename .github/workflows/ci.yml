name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        shell: bash
        run: |
          set +e
          uv run pytest
          exit_code=$?
          if [ "$exit_code" -eq 0 ] || [ "$exit_code" -eq 5 ]; then
            if [ "$exit_code" -eq 5 ]; then
              echo "No tests collected — acceptable for bootstrap phase."
            fi
            exit 0
          fi
          exit "$exit_code"

  golden-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify golden fixtures
        run: uv run python scripts/ci/verify_golden_fixtures.py

  mock-agent-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run deterministic mock agent
        run: uv run python examples/demo_agent/run.py --output /tmp/mock_run.json

      - name: Verify mock agent capture log
        uses: ./.github/actions/verify-trace
        with:
          trace-file: /tmp/mock_run.json
          contract-file: examples/policies/mvp.yaml
          source: capture

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build

      - name: Install wheel and run bundled demo
        run: |
          pip install dist/varly-*.whl
          varly verify --demo
          varly --help
